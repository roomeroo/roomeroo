name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 0 * * *" # cada día a medianoche (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#6d4aff&color_dots=#eff2f5,#ddd5ff,#b9a8ff,#9278ff,#6d4aff
            dist/snake-dark.svg?palette=github-dark&color_snake=#c7b8ff&color_dots=#151b23,#2b2360,#443799,#6a52e0,#9d85ff

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
