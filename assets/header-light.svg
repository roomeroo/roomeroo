<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t">
  <title id="t">Adrián Romero · Python · Machine Learning · Big Data · TypeScript</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .tag  { fill: #59636e; font-size: 15px; letter-spacing: .12em; }
    .name { fill: #1f2328; font-size: 66px; font-weight: 600; letter-spacing: -.025em; }
    .sub  { fill: #59636e; font-size: 18px; letter-spacing: .02em; }
    .acc  { fill: #6d4aff; }
    .grid { fill: #1f2328; opacity: .09; }
    .line { stroke: #6d4aff; stroke-width: 2; stroke-linecap: round;
            stroke-dasharray: 140; stroke-dashoffset: 140;
            animation: draw 1.1s .6s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade { opacity: 0; animation: fade .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .9s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes fade  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle class="grid" cx="2" cy="2" r="1.2"/>
    </pattern>
    <linearGradient id="fadeMask" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".28" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".72" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1000" height="250" fill="url(#fadeMask)"/></mask>
  </defs>

  <rect width="1000" height="250" fill="url(#dots)" mask="url(#m)"/>

  <g text-anchor="middle">
    <text class="mono tag fade d1" x="500" y="62">@ROOMEROO<tspan class="acc cursor">_</tspan></text>
    <text class="sans name fade d2" x="500" y="138">Adrián Romero</text>
    <line class="line" x1="430" y1="170" x2="570" y2="170"/>
    <text class="mono sub fade d3" x="500" y="212">Python <tspan class="acc">·</tspan> Machine Learning <tspan class="acc">·</tspan> Big Data <tspan class="acc">·</tspan> TypeScript</text>
  </g>
</svg>
